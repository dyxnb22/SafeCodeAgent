name: SafeCode CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run full regression
        run: PYTHONPATH=src python3 -m pytest -q

      - name: Run release smoke
        run: PYTHONPATH=src python3 -m safecode.cli release smoke

      - name: Run release metadata audit
        run: PYTHONPATH=src python3 -m safecode.cli release meta

      - name: Generate release changelog preview
        run: PYTHONPATH=src python3 -m safecode.cli release changelog --recent 5

  smoke-windows:
    name: Windows smoke (Python 3.11)
    runs-on: windows-latest
    # Advisory: Windows is a smoke lane only. Failures do not block merges.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run smoke tests
        run: python -m pytest tests/test_release_smoke.py tests/test_cli_json_output.py -q

  loop-eval:
    name: Agent loop eval (advisory)
    runs-on: ubuntu-latest
    # Advisory: failures are visible in CI output but do not block merges.
    # Will be made blocking after one clean cycle per v2.9.3 plan.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run agent loop eval (scripted, no live provider)
        run: PYTHONPATH=src python3 -m safecode.cli eval --mode loop

  live-provider:
    name: Live provider eval (advisory, secret-gated)
    runs-on: ubuntu-latest
    # Advisory: live provider failures do not block merges.
    continue-on-error: true
    # Only run when the repository variable ENABLE_LIVE_LLM_TESTS is set to 'true'.
    # This keeps the live lane opt-in and prevents accidental credential exposure.
    if: ${{ vars.ENABLE_LIVE_LLM_TESTS == 'true' }}
    env:
      SAFECODE_LIVE_TESTS: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run live provider smoke tests
        run: PYTHONPATH=src python3 -m pytest tests/live/ -v --tb=short
