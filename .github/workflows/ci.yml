name: SafeCode CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python tests and release smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run full regression
        run: PYTHONPATH=src python3 -m pytest -q

      - name: Run release smoke
        run: PYTHONPATH=src python3 -m safecode.cli release smoke

      - name: Run release metadata audit
        run: PYTHONPATH=src python3 -m safecode.cli release meta

      - name: Generate release changelog preview
        run: PYTHONPATH=src python3 -m safecode.cli release changelog --from 2.6.14 --to 2.6.17
