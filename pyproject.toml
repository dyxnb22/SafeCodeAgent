[project]
name = "safecode-agent"
version = "7.1.5"
description = "A safety-first terminal coding agent with diff review, checkpoints, rollback, and audit logs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
sac = "safecode.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.6.0",
    "pyyaml>=6.0.0",
]
examples = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]
semantic = [
    "jedi>=0.19.0",
    "sentence-transformers>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.6.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safecode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slower integration, subprocess, timeout, or eval tests skipped by the fast local suite",
    "integration: tests that exercise multiple subsystems or end-to-end workflows",
    "subprocess: tests that spawn Python, pytest, git, shell, or demo subprocesses",
    "eval: tests that exercise eval harnesses or replay fixtures",
    "timeout: tests that intentionally wait for timeout handling",
]
