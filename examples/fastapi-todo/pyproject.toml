[project]
name = "safecode-fastapi-todo-example"
version = "0.1.0"
description = "Small FastAPI todo API used as a SafeCode Agent demo target."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
